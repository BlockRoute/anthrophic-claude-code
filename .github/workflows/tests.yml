name: tests

# Runs on every pull request, and on pushes to the default branch. The default
# branch is listed alongside main/master so this keeps working if the repo is
# ever renamed to a conventional default.
on:
  pull_request:
  push:
    branches:
      - main
      - master
      - claude/add-claude-documentation-dfriw

permissions:
  contents: read

# A new push to the same ref supersedes the run already in flight.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # hoodtrack is standard library only, so the matrix exists to catch
        # accidental use of syntax or stdlib APIs newer than the stated floor.
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Report interpreter
        run: python -VV

      - name: Byte-compile every source file
        run: python -m compileall -q hoodtrack scripts tests

      - name: Run test suite
        run: python -m unittest discover -s tests -v
